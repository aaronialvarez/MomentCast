name = "momentcast-api-production"
main = "src/worker.ts"
compatibility_date = "2025-01-05"

[env.production]
name = "momentcast-api-production"
vars = { ENVIRONMENT = "production" }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[triggers]
# ONE trigger on purpose. The Free plan allows 5 cron triggers per ACCOUNT, shared with
# your other Workers. scheduled() in src/worker.ts routes each 5-minute tick to one job
# by its UTC time (daily cleanup, MailerLite retry, viewer-hours sync, test cap + retention).
crons = ["*/5 * * * *"]