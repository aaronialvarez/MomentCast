name = "momentcast-api-production"
main = "src/worker.ts"
compatibility_date = "2025-01-05"

[env.production]
name = "momentcast-api-production"
vars = { ENVIRONMENT = "production" }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[triggers]
# Hourly (0 * * * *): MailerLite retry for confirmed signups the webhook missed
# Every 5 min (*/5 * * * *): cap test-event sessions at 15 min connected
crons = ["0 3 * * *", "*/10 * * * *", "*/5 * * * *", "0 * * * *"]  # Daily cleanup at 3 AM UTC + viewer-hours sync every 10 min