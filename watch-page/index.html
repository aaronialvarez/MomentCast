<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MomentCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ==================== LOADING ==================== -->
    <div id="loading" class="state">
      <div class="mc-center" style="text-align:center;">
        <div class="mc-loader">
          <span class="mc-dot"></span>
          <span class="mc-dot"></span>
          <span class="mc-dot"></span>
        </div>
        <p class="mc-loading-text">Loading event</p>
      </div>
    </div>

    <!-- ==================== ERROR ==================== -->
    <div id="error" class="state hidden">
      <div class="mc-center" style="text-align:center;">
        <p class="mc-eyebrow">MomentCast</p>
        <h1>Event Not Found</h1>
        <p>This event doesn't exist or has been removed.</p>
        <div class="mc-powered" style="margin-top:3rem;">
          Powered by <a href="https://momentcast.live"><strong>MomentCast</strong></a>
        </div>
      </div>
    </div>

    <!-- ==================== COUNTDOWN ==================== -->
    <div id="countdown" class="state hidden">
      <div class="mc-center">
        <p class="mc-eyebrow">Upcoming Event</p>
        <h1 id="event-title" class="mc-display-title"></h1>

        <!--
          .countdown-timer: script.js may replace innerHTML of this element
          for WAITING / ENDED / EXPIRED modes. Keep the class name exactly.
        -->
        <div class="countdown-timer">
          <h2 class="mc-countdown-label">Event starts in</h2>

          <!--
            .timer-display: the grid holding timer units.
            script.js hides daysEl.parentElement (.timer-unit) when countdown hits zero.
            Each span ID (days/hours/minutes/seconds) must stay exactly as-is.
          -->
          <div class="timer-display">
            <div class="timer-unit">
              <span id="days" class="timer-value">00</span>
              <span class="timer-label">Days</span>
            </div>
            <div class="timer-unit">
              <span id="hours" class="timer-value">00</span>
              <span class="timer-label">Hours</span>
            </div>
            <div class="timer-unit">
              <span id="minutes" class="timer-value">00</span>
              <span class="timer-label">Min</span>
            </div>
            <div class="timer-unit">
              <span id="seconds" class="timer-value">00</span>
              <span class="timer-label">Sec</span>
            </div>
          </div>

          </div>

        <!-- Cover photo + overlay content injected here by applyCoverBackground() -->

        <!-- Scheduled date — positioned on top of the cover photo -->
        <p id="scheduled-time" class="scheduled-time"></p>

        <!-- QR share block — visible in COUNTDOWN and WAITING states only. -->
        <div id="qr-share-block" class="qr-share-block hidden">
          <p class="qr-label">Share this stream</p>
          <img id="qr-image" class="qr-image" src="" alt="Scan to share this event" width="140" height="140" />
          <p id="qr-url" class="qr-url"></p>
        </div>

        <p class="mc-powered">Powered by <strong>MomentCast</strong></p>
      </div>
    </div>

    <!-- ==================== LIVE STREAM ==================== -->
    <div id="live" class="state hidden">
      <div class="mc-player-wrap">

        <div class="mc-player-header">
          <!-- Title + date stacked; date is injected by setEventDateSubtitle() -->
          <div class="mc-player-header-text">
            <h1 id="live-title" class="mc-player-title"></h1>
            <!-- .mc-event-date injected here by script.js -->
          </div>
          <!--
            .live-badge: the LIVE indicator badge.
            Only the replay badge class gets swapped by updateStatusBadge().
          -->
          <span class="live-badge">Live</span>
        </div>

        <div class="mc-video-outer">
          <!--
            .video-container + .relative:
            script.js does liveEl.querySelector('.relative') to find this container
            and may replace its innerHTML when recreating the iframe.
            Both classes are required.
          -->
          <div class="video-container relative">
            <!-- #live-stream: src set by showLive() -->
            <iframe
              id="live-stream"
              src=""
              style="border:none; position:absolute; top:0; left:0; height:100%; width:100%"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
              allowfullscreen="true"
            ></iframe>
          </div>
        </div>

        <div class="mc-player-footer">
          <p class="mc-powered">Powered by <strong>MomentCast</strong></p>
        </div>

      </div>
    </div>

    <!-- ==================== REPLAY / RECORDING ==================== -->
    <div id="replay" class="state hidden">
      <div class="mc-player-wrap">

        <div class="mc-player-header">
          <!-- Title + date stacked; date is injected by setEventDateSubtitle() -->
          <div class="mc-player-header-text">
            <h1 id="replay-title" class="mc-player-title"></h1>
            <!-- .mc-event-date injected here by script.js -->
          </div>
          <!--
            .ended-badge: updateStatusBadge() queries this class and swaps it to
            live-badge / paused-badge / ready-badge / ended-badge based on event state.
            The class name must stay as 'ended-badge' as the initial value.
          -->
          <span class="ended-badge">Ended</span>
        </div>

        <div class="mc-video-outer">
          <!--
            Same requirement as live: needs both .video-container and .relative.
            Completion overlay and processing overlay are appended to streamEl.parentElement.
          -->
          <div class="video-container relative">
            <!-- #replay-stream: src set by recording playback functions -->
            <iframe
              id="replay-stream"
              src=""
              style="border:none; position:absolute; top:0; left:0; height:100%; width:100%"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
              allowfullscreen="true"
            ></iframe>
          </div>
        </div>

        <div class="mc-player-footer">
          <p class="mc-powered">Powered by <strong>MomentCast</strong></p>
        </div>

      </div>
    </div>

  </div><!-- /#app -->

  <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
  <script src="script.js"></script>
</body>
</html>
